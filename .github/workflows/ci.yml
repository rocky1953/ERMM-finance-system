name: ERMM CI

# 觸發時機：push 到任何分支 + PR 到 main
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'master']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: ERMM_db_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: ERMM_db_ci
        run: |
          echo "SELECT 1;" | mysql -h 127.0.0.1 -u root -prootpass
          # 如需建表，這裡跑 migrations
          for f in migrations/*.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -u root -prootpass ERMM_db_ci < "$f" || echo "  (may already exist, continuing)"
          done

      - name: Code syntax check
        run: |
          node --check app.js
          for f in routes/*.js services/*.js middleware/*.js; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
        continue-on-error: true

      - name: Run Jest tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: ERMM_db_ci
          JWT_SECRET: ci_test_secret_key
        run: npm test
        continue-on-error: true

      - name: Upload test coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run lint
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Archive production build
        uses: actions/upload-artifact@v4
        with:
          name: ermm-build-${{ github.sha }}
          path: |
            app.js
            config/
            routes/
            services/
            middleware/
            public/
            package.json
            package-lock.json
          if-no-files-found: ignore
          retention-days: 30
