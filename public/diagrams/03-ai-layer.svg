  </style>
  <rect width="720" height="414" fill="#FFFFFF"/>
  <defs>
    <marker id="arwC" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <text class="ts" x="40" y="18">① AI 应用入口</text>
  <rect class="band" x="32" y="24" width="656" height="110" rx="8"/>
